<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cozy Corner</title>
  <meta name="description" content="A cozy anime & donghua watchlist.">
  <meta name="theme-color" content="#fff6ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16132a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cozy Corner">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script>try { const t = localStorage.getItem('cc.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <div id="ambient" aria-hidden="true"></div>
  <div id="splash" aria-hidden="true">
    <svg class="mochi" viewBox="0 0 120 100">
      <path d="M24 44 L30 12 L52 32 Z" class="m-body m-ear m-ear-l"/>
      <path d="M96 44 L90 12 L68 32 Z" class="m-body m-ear m-ear-r"/>
      <ellipse cx="60" cy="62" rx="48" ry="34" class="m-body"/>
      <g class="m-eyes"><circle cx="44" cy="60" r="4.5" class="m-ink"/><circle cx="76" cy="60" r="4.5" class="m-ink"/></g>
      <ellipse cx="34" cy="70" rx="7" ry="4" class="m-blush"/><ellipse cx="86" cy="70" rx="7" ry="4" class="m-blush"/>
      <path d="M54 68 q3 4 6 0 q3 4 6 0" class="m-mouth"/>
    </svg>
    <h1>cozy corner</h1>
    <p data-subtitle>just for my sweet princess</p>
  </div>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✿</span>
        <div>
          <h1>cozy corner</h1>
          <p class="greet" data-subtitle>just for my sweet princess</p>
        </div>
      </div>

      <nav class="nav" aria-label="Main">
        <button class="nav-btn" data-view="list" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a1 1 0 0 1 1 1v15l-8-4-8 4V5a1 1 0 0 1 1-1z"/></svg>
          <span>My shelf</span>
        </button>
        <button class="nav-btn nav-add" data-action="search">
          <span class="plus" aria-hidden="true">+</span>
          <span>Add</span>
        </button>
        <button class="nav-btn" data-view="airing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
          <span>Airing</span>
        </button>
      </nav>

      <div class="top-actions">
        <button class="icon-btn" id="settingsBtn" aria-label="Backup, restore and app info">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn" id="signOutBtn" aria-label="Sign out" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
        </button>
      </div>
    </header>

    <main id="main"></main>
  </div>

  <div id="login" class="login" hidden>
    <div class="login-card">
      <svg class="mochi alive" viewBox="0 0 120 100" aria-hidden="true">
        <path d="M24 44 L30 12 L52 32 Z" class="m-body m-ear m-ear-l"/>
        <path d="M96 44 L90 12 L68 32 Z" class="m-body m-ear m-ear-r"/>
        <ellipse cx="60" cy="62" rx="48" ry="34" class="m-body"/>
        <g class="m-eyes"><circle cx="44" cy="60" r="4.5" class="m-ink"/><circle cx="76" cy="60" r="4.5" class="m-ink"/></g>
        <ellipse cx="34" cy="70" rx="7" ry="4" class="m-blush"/><ellipse cx="86" cy="70" rx="7" ry="4" class="m-blush"/>
        <path d="M54 68 q3 4 6 0 q3 4 6 0" class="m-mouth"/>
      </svg>
      <h1>cozy corner</h1>
      <p class="dim">Your anime &amp; donghua shelf, on every device.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
        <button class="pill big" type="submit">Send me a sign-in email</button>
      </form>
      <form id="codeForm" hidden>
        <p>Sent to <b id="sentTo"></b> ✿<br><span id="codeHint">Tap the link in the email to sign in, or type the code here if the email has one:</span></p>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" placeholder="123456" aria-label="Sign-in code">
        <button class="pill big" type="submit">Sign in</button>
        <button class="link" type="button" id="backBtn">Use a different email</button>
      </form>
      <p class="err" id="loginErr" role="alert"></p>
    </div>
  </div>

  <dialog id="searchDlg" class="sheet-dlg search-dlg" aria-label="Add a show">
    <div class="sheet">
      <div class="grab" aria-hidden="true"></div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Search anime or donghua…" autocomplete="off" enterkeyhint="search" aria-label="Search">
        <button class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <div id="results" class="results"></div>
    </div>
  </dialog>

  <dialog id="detailDlg" class="sheet-dlg" aria-label="Show details"></dialog>
  <dialog id="settingsDlg" class="sheet-dlg" aria-label="Backup and app info">
    <div class="sheet detail">
      <div class="grab" aria-hidden="true"></div>
      <button class="icon-btn close" data-close aria-label="Close">×</button>
      <div id="settingsBody"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
